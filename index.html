<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EEEDF5" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="本地优先的个人物品管理工具，数据保存在本机浏览器中。" />

    <!--
      主题引导：必须在任何样式/脚本之前同步执行，保证**首帧**就是正确主题，
      深色模式下不会先闪一屏白再变黑。

      取值与 src/theme/theme.ts 必须一致（THEME_STORAGE_KEY / CANVAS_COLOR），
      src/theme/theme.test.ts 会断言这份内联脚本与模块常量保持同步。
    -->
    <script>
      (function () {
        try {
          var KEY = 'pil.theme'
          var stored = localStorage.getItem(KEY)
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var theme = dark ? 'dark' : 'light'
          document.documentElement.dataset.theme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#101013' : '#EEEDF5')
        } catch (e) {
          /* 隐私模式等场景下静默降级为浅色默认值 */
        }
      })()
    </script>

    <!--
      浏览器标签页图标：**单一**正式图标，与 PWA / iOS 主屏同源（同一张母版派生）。
      本项目明确不做 light/dark 双 favicon —— 不引入主题图标系统，也不需要 media 条件切换。
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/pwa/favicon-32x32.png" />

    <!--
      iOS：添加到主屏幕 + 全屏运行。
      沿用**单一**正式图标：主屏图标只在用户「添加到主屏幕」那一刻由 Safari 静态抓取并保存。
      iOS 若自己对图标施加 dark / tinted 外观，那是系统行为，我们接受；不做任何非标准 hack。

      文件名带 -v5：iOS 对 apple-touch-icon 缓存极强，换 URL 是唯一可靠的 cache bust 手段
      （旧文件 apple-touch-icon-180x180.png / -v2 / -v3 / -v4 均已由生成器删除，不再存在）。
    -->
    <link rel="apple-touch-icon" href="/icons/pwa/apple-touch-icon-180x180-v5.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="物品库" />

    <title>我的物品库</title>
    <style>
      html { background: #EEEDF5; }
      html[data-theme='dark'] { background: #101013; }
      .pwa-update-cover { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: #EEEDF5; color: #24242a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; text-align: center; touch-action: none; }
      .pwa-update-cover[hidden] { display: none; }
      html[data-theme='dark'] .pwa-update-cover { background: #101013; color: #f2f2f7; }
      .pwa-update-cover strong { margin-top: 10px; font-size: 18px; font-weight: 600; }
      .pwa-update-cover p { margin: 0; font-size: 13px; opacity: .62; }
      .pwa-update-spinner { width: 28px; height: 28px; border: 3px solid currentColor; border-right-color: transparent; border-radius: 50%; opacity: .65; }
      .pwa-update-cover[data-phase='complete'] { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: no-preference) {
        .pwa-update-cover { transition: opacity 180ms ease; }
        .pwa-update-cover[data-phase='updating'] { animation: pwa-update-in 160ms ease-out; }
        .pwa-update-spinner { animation: pwa-update-spin 800ms linear infinite; }
      }
      @keyframes pwa-update-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes pwa-update-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="pwa-update-cover" class="pwa-update-cover" data-phase="restoring" role="status" aria-live="polite" hidden>
      <span class="pwa-update-spinner" aria-hidden="true"></span>
      <strong id="pwa-update-title">正在恢复页面</strong>
      <p>正在应用更新，请稍候</p>
    </div>
    <script id="pwa-update-bootstrap">
      (function () {
        try {
          var saved = JSON.parse(sessionStorage.getItem('pil.pwa.update-resume') || 'null')
          var age = saved && Date.now() - saved.at
          var path = location.pathname + location.search + location.hash
          if (!saved || typeof saved.at !== 'number' || !Number.isFinite(saved.at) || age < 0 || age > 120000 || saved.path !== path ||
            ![saved.x, saved.y].every(function (n) { return typeof n === 'number' && Number.isFinite(n) && n >= 0 && n <= 10000000 })) return
          document.getElementById('pwa-update-cover').hidden = false
          document.getElementById('root').inert = true
          history.scrollRestoration = 'manual'
        } catch (e) { /* 临时存储不可用时正常打开页面 */ }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
